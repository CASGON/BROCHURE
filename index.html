<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | BROCHURE</title>
    <meta name="description" content="">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- Three.js para el logo 3D animado -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
    </script>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container" style="width: 100%; height: 100%;">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>
      
      <div id="unity-loading-bar">
        <div id="unity-logo">
          <canvas id="fmp-3d-logo"></canvas>
        </div>
        
        <!-- Texto de la marca con efecto eléctrico -->
        <div class="fmp-brand-text">FormMatterPrime</div>
        
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="entervr" value="Enter VR" disabled>VR</button>
        <button id="enterar" value="Enter AR" disabled>AR</button>
        <div id="unity-webxr-link">Using <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank" title="WebXR Export">WebXR Export</a></div>
        <div id="unity-build-title">BROCHURE</div>
      </div>
    </div>

    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Ejemplo_XR.loader.js";
      var config = {
        dataUrl: buildUrl + "/Ejemplo_XR.data",
        frameworkUrl: buildUrl + "/Ejemplo_XR.framework.js",
        codeUrl: buildUrl + "/Ejemplo_XR.wasm",
        // Se eliminaron los #if para que VS Code no marque errores de sintaxis
        memoryUrl: buildUrl + "/",
        symbolsUrl: buildUrl + "/",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "BROCHURE",
        productVersion: "0.1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var unityInstance = null;
      

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          
          // Notifica al logo 3D para que se detenga y libere GPU
          window.dispatchEvent(new Event('fmp-unity-loaded'));
          
          if (fullscreenButton)
          {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      let enterARButton = document.getElementById('enterar');
      let enterVRButton = document.getElementById('entervr');

      document.addEventListener('onARSupportedCheck', function (event) {
        enterARButton.disabled = !event.detail.supported;
      }, false);
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
      }, false);

      enterARButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleAR();
      }, false);
      enterVRButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleVR();
      }, false);
    </script>

    <!-- =========================================================
         FormMatterPrime — Logo 3D animado (cubo → Tesseract 4D)
         ========================================================= -->
    <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('fmp-3d-logo');
    if (canvas) {
      const getSize = () => Math.max(120, canvas.clientWidth || 300);

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true
      });
      renderer.setSize(getSize(), getSize(), false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      camera.position.set(0, 0, 10);

      const Y_AXIS = new THREE.Vector3(0, 1, 0);

      function makeEdge(radius) {
        const geo = new THREE.CylinderGeometry(radius, radius, 1, 12, 1);
        const mat = new THREE.MeshBasicMaterial({
          color: 0x0a0a0a,
          transparent: true,
          opacity: 1
        });
        return new THREE.Mesh(geo, mat);
      }
      function orientEdge(mesh, a, b) {
        const dir = new THREE.Vector3().subVectors(b, a);
        const len = dir.length();
        mesh.position.copy(a).add(b).multiplyScalar(0.5);
        mesh.scale.set(1, len, 1);
        mesh.quaternion.setFromUnitVectors(Y_AXIS, dir.normalize());
      }

      // ---------- Cubo 3D ----------
      const H = 1.2;
      const cubeVerts = [
        [-H,-H,-H],[H,-H,-H],[H,H,-H],[-H,H,-H],
        [-H,-H, H],[H,-H, H],[H,H, H],[-H,H, H]
      ];
      const cubeEdges = [
        [0,1],[1,2],[2,3],[3,0],
        [4,5],[5,6],[6,7],[7,4],
        [0,4],[1,5],[2,6],[3,7]
      ];
      const cubeGroup = new THREE.Group();
      const cubeEdgeMeshes = [];
      for (const [a, b] of cubeEdges) {
        const m = makeEdge(0.045);
        orientEdge(m, new THREE.Vector3(...cubeVerts[a]), new THREE.Vector3(...cubeVerts[b]));
        cubeGroup.add(m);
        cubeEdgeMeshes.push(m);
      }
      scene.add(cubeGroup);

      // ---------- Tesseract 4D ----------
      const V4 = [];
      for (let i = 0; i < 16; i++) {
        V4.push([(i&1)?1:-1, (i&2)?1:-1, (i&4)?1:-1, (i&8)?1:-1]);
      }
      const E4 = [];
      for (let i = 0; i < 16; i++) {
        for (let j = i+1; j < 16; j++) {
          let d = 0;
          for (let k = 0; k < 4; k++) if (V4[i][k] !== V4[j][k]) d++;
          if (d === 1) E4.push([i, j]);
        }
      }
      const tessGroup = new THREE.Group();
      const tessEdgeMeshes = [];
      for (let i = 0; i < E4.length; i++) {
        const m = makeEdge(0.028);
        m.material.opacity = 0;
        tessGroup.add(m);
        tessEdgeMeshes.push(m);
      }
      tessGroup.scale.setScalar(H / (3.5 / 4.5));
      scene.add(tessGroup);

      function rot4D(p, ax, ay, az) {
        let [x,y,z,w] = p, c, s, t;
        c = Math.cos(ax); s = Math.sin(ax);
        t = x*c - w*s; w = x*s + w*c; x = t;
        c = Math.cos(ay); s = Math.sin(ay);
        t = y*c - w*s; w = y*s + w*c; y = t;
        c = Math.cos(az); s = Math.sin(az);
        t = z*c - w*s; w = z*s + w*c; z = t;
        return [x,y,z,w];
      }
      function project4D(p, dist) {
        const [x,y,z,w] = p;
        const f = dist / (dist - w);
        return new THREE.Vector3(x*f, y*f, z*f);
      }

      const clock = new THREE.Clock();
      const LOOP = 12;
      const tmpA = new THREE.Vector3();
      const tmpB = new THREE.Vector3();
      function smoothstep(a, b, x) {
        const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
        return t*t*(3 - 2*t);
      }

      let running = true;
      function animate() {
        if (!running) return;
        requestAnimationFrame(animate);

        const elapsed = clock.getElapsedTime();
        const t = (elapsed % LOOP) / LOOP;

        const spinX = elapsed * 0.55;
        const spinY = elapsed * 0.85;
        const spinZ = Math.sin(elapsed * 0.4) * 0.25;
        cubeGroup.rotation.set(spinX, spinY, spinZ);
        tessGroup.rotation.set(spinX, spinY, spinZ);

        let tessOp = 0, cubeOp = 1, cubeScale = 1, unfold = 0;
        if (t < 0.15) {
          // solo cubo
        } else if (t < 0.40) {
          const u = smoothstep(0.15, 0.40, t);
          tessOp = u; cubeOp = 1 - u*0.9; cubeScale = 1 - u*0.15; unfold = u;
        } else if (t < 0.70) {
          tessOp = 1; cubeOp = 0.1; cubeScale = 0.85; unfold = 1;
        } else if (t < 0.90) {
          const u = smoothstep(0.70, 0.90, t);
          tessOp = 1 - u; cubeOp = 0.1 + u*0.9; cubeScale = 0.85 + u*0.15; unfold = 1 - u;
        } else {
          tessOp = 0; cubeOp = 1; cubeScale = 1; unfold = 0;
        }

        for (const m of cubeEdgeMeshes) m.material.opacity = cubeOp;
        for (const m of tessEdgeMeshes) m.material.opacity = tessOp;
        cubeGroup.scale.setScalar(cubeScale);

        const baseA = elapsed * 0.75;
        const ax = baseA + unfold * 1.3;
        const ay = baseA * 0.65 + unfold * 1.0;
        const az = baseA * 0.45 + unfold * 0.7;

        for (let i = 0; i < E4.length; i++) {
          const [a, b] = E4[i];
          tmpA.copy(project4D(rot4D(V4[a], ax, ay, az), 3.5));
          tmpB.copy(project4D(rot4D(V4[b], ax, ay, az), 3.5));
          orientEdge(tessEdgeMeshes[i], tmpA, tmpB);
        }

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        const s = getSize();
        renderer.setSize(s, s, false);
      });

      window.addEventListener('fmp-unity-loaded', () => {
        running = false;
        renderer.dispose();
      });
    }
    </script>
  </body>
</html>
